<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14202E">
<title>Rodinný rozpočet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <main class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen"></div>
      <nav class="tabbar" aria-label="Hlavná navigácia" id="tabbar"></nav>
      <div class="sheet-wrap" id="sheet" hidden>
        <form class="sheet" id="form" aria-label="Nový zápis" novalidate>
          <header><h2 id="stitle">Nový výdavok</h2><button type="button" class="x" data-act="close" aria-label="Zavrieť"></button></header>
          <div class="seg full" role="group" aria-label="Typ zápisu"><button type="button" id="m-exp" data-act="mode" data-v="exp">Výdavok</button><button type="button" id="m-inc" data-act="mode" data-v="inc">Príjem</button></div>
          <label class="amt" for="amt"><input id="amt" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Suma v eurách"><span>€</span></label>
          <div id="catwrap"><div class="sec-t" style="margin-bottom:8px">Kategória</div><div id="chips"></div></div>
          <div id="subwrap"></div>
          <div><div class="sec-t" id="wholbl" style="margin-bottom:8px">Kto platil</div><div class="whoseg" id="whoseg"></div></div>
          <label class="fld" for="date">Dátum<input id="date" type="date"  ></label>
          <label class="fld" for="note">Poznámka<input id="note" type="text" placeholder="Napr. Lidl" autocomplete="off"></label>
          <button class="btn" id="save" type="submit" disabled>Pridať výdavok</button>
        </form>
      </div>
      <div class="editor" id="editor" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="gate" id="gate"><div class="loading">Načítavam…</div></div>
    </div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
