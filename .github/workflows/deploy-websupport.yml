name: Deploy to Websupport

# Nasadí aplikáciu a API na hosting cez FTP(S). Prístupové údaje sú v tajných kľúčoch repozitára
# (Settings > Secrets and variables > Actions), nikdy v kóde.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create api/config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SEED_DEBTS_JSON: ${{ secrets.SEED_DEBTS_JSON }}
        run: |
          php -r '
            $seed = json_decode(getenv("SEED_DEBTS_JSON") ?: "[]", true);
            $cfg = ["driver" => "mysql", "host" => getenv("DB_HOST"), "name" => getenv("DB_NAME"), "user" => getenv("DB_USER"), "pass" => getenv("DB_PASS"), "seed_debts" => is_array($seed) ? $seed : []];
            file_put_contents("api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '
          php -l api/config.php

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .gitignore
