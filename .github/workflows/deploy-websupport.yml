name: Deploy to Websupport

# Nasadí aplikáciu a API na hosting cez FTP(S). Prístupové údaje sú v tajných kľúčoch repozitára
# (Settings > Secrets and variables > Actions), nikdy v kóde.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create api/config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SEED_DEBTS_JSON: ${{ secrets.SEED_DEBTS_JSON }}
        run: |
          php -r '
            $seed = json_decode(getenv("SEED_DEBTS_JSON") ?: "[]", true);
            $cfg = ["driver" => "mysql", "host" => getenv("DB_HOST"), "port" => getenv("DB_PORT") ?: null, "name" => getenv("DB_NAME"), "user" => getenv("DB_USER"), "pass" => getenv("DB_PASS"), "seed_debts" => is_array($seed) ? $seed : []];
            file_put_contents("api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '
          php -l api/config.php

      - name: Upload via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || 22 }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Heslo ide cez argument -u (nie cez skript), aby špeciálne znaky ako ; ' " $ nič nerozbili.
          lftp -p "$SFTP_PORT" -u "$SFTP_USER,$SFTP_PASS" \
            -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; mkdir -p -f $REMOTE_DIR; rm -r -f $REMOTE_DIR/.git; rm -r -f $REMOTE_DIR/.github; rm -f $REMOTE_DIR/index.php; mirror -R --verbose --no-perms -x '^\.git' -x '^README\.md$' . $REMOTE_DIR; bye" \
            "sftp://$SFTP_HOST"
