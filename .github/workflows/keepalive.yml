name: Keep Supabase awake

# Supabase (free plan) pauses a project after a week without activity.
# This job calls the database every 3 days so the app keeps working.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the database
        run: |
          URL='https://xqxcxmpezqpisoatgxvi.supabase.co'
          KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxeGN4bXBlenFwaXNvYXRneHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMjY5MzIsImV4cCI6MjEwNjYwMjkzMn0.63ArB-wFSOJPOJhpskEiniszWDYt9AFVR8FWCoWjxgQ'
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/get_state" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"p_code":"keepalive"}' || echo 000)
          echo "HTTP $code"
          # 400 = the database answered (the code is intentionally invalid). 5xx or no answer = project is down.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then echo "Supabase project is not responding (paused?)"; exit 1; fi
